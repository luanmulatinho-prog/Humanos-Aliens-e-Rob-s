$('eventModal').onclick = e => {
  const rooms = load(), r = rooms[currentRoom];
  if (!r) return;
  const state = ensureColonyState(r, me.id);
  const ev = state.activeEventModal;
  if (!ev) return;

  if (e.target.closest('.btn-ev-close')) {
    state.activeEventModal = null;
    save(rooms); renderLobby();
    return;
  }

  const pickBuilderBtn = e.target.closest('.btn-ev-pick-builder');
  if (pickBuilderBtn && ev.type === 'visitor') {
    ev.selectedBuilderId = +pickBuilderBtn.dataset.cid;
    save(rooms); renderLobby();
    return;
  }

  if (e.target.closest('.btn-ev-accept') && ev.visitor) {
    if (ev.selectedBuilderId === undefined || ev.selectedBuilderId === null) return;
    if (!canAddColonists(r, me.id, 1)) return;
    const builderId = ev.selectedBuilderId;

    // Devolve custo se o construtor estava em outra tarefa
    const oldDef = state.assignments[builderId] ? findActionDef(state.assignments[builderId]) : null;
    if (oldDef) refundCost(state.resources, actionCost(oldDef));

    // Designa e trava o construtor na tarefa de construção da Cápsula de Emergência
    state.assignments[builderId] = 'build_capsula';
    state.pinned[builderId] = 'build_capsula';
    state.capsuleBuilderId = builderId;
    state.capsulePaid = false;
    state.capsuleProgress = 0;

    r.colonists[me.id] = r.colonists[me.id] || [];
    r.chosen[me.id] = r.chosen[me.id] || [];
    r.colonists[me.id].push(ev.visitor);
    r.chosen[me.id].push(ev.visitor.id);
    state.visitorAccepted = true;
    state.activeEventModal = null;
    syncSynergy(r, me.id);
    pushNotice(state, `🛸 ${ev.visitor.nome} juntou-se à colônia! O construtor designado está alocado na Cápsula de Emergência (🪵10 🪨15 · 4 estações).`);
    save(rooms); renderLobby();
    return;
  }

  const toggleTravBtn = e.target.closest('.btn-ev-toggle-traveler');
  if (toggleTravBtn && ev.type === 'crash_landing') {
    const tid = +toggleTravBtn.dataset.tid;
    ev.acceptedIds = ev.acceptedIds || [];
    if (ev.acceptedIds.includes(tid)) {
      ev.acceptedIds = ev.acceptedIds.filter(id => id !== tid);
    } else if (canAddColonists(r, me.id, ev.acceptedIds.length + 1)) {
      ev.acceptedIds.push(tid);
    }
    save(rooms); renderLobby();
    return;
  }

  if (e.target.closest('.btn-ev-confirm-crash') && ev.type === 'crash_landing') {
    const accepted = (ev.travelers || []).filter(t => (ev.acceptedIds || []).includes(t.id));
    r.colonists[me.id] = r.colonists[me.id] || [];
    r.chosen[me.id] = r.chosen[me.id] || [];
    accepted.forEach(t => {
      if (canAddColonists(r, me.id, 1)) {
        r.colonists[me.id].push(t);
        r.chosen[me.id].push(t.id);
      }
    });
    state.activeEventModal = null;
    syncSynergy(r, me.id);
    pushNotice(state, accepted.length
      ? `💥 Você acolheu ${accepted.map(t => t.nome).join(', ')} do pouso forçado!`
      : '💥 Nenhum sobrevivente do pouso forçado foi integrado à colônia.');
    save(rooms); renderLobby();
    return;
  }

  if (e.target.closest('.btn-ev-accept-escape') && ev.type === 'escape_route') {
    if (!canAddColonists(r, me.id, 2)) return;
    state.pendingEscapees = state.pendingEscapees || [];
    state.pendingEscapees.push({
      seasonsLeft: 3,
      travelers: ev.travelers
    });
    state.activeEventModal = null;
    pushNotice(state, '🚨 Você aceitou o pedido de asilo! Os dois viajantes chegarão à colônia em 3 estações.');
    save(rooms); renderLobby();
    return;
  }

  if (e.target.closest('.btn-ev-reject')) {
    state.activeEventModal = null;
    pushNotice(state, '🛸 Você recusou a proposta.');
    save(rooms); renderLobby();
    return;
  }
};

$('buildingModal').onclick = e => {
  if (e.target === $('buildingModal') || e.target.closest('.btn-bmodal-close')) {
    activeBuildingModal = null;
    renderLobby();
    return;
  }
  const rooms = load(), r = rooms[currentRoom];
  if (!r) return;
  const state = ensureColonyState(r, me.id);
  const team = getMyTeam(r);
  const locked = Boolean((r.seasonReady || {})[me.id]);

  // Moradias: adicionar/remover morador
  const addHouseBtn = e.target.closest('.btn-house-add');
  if (addHouseBtn) {
    const unit = addHouseBtn.dataset.unit;
    const cid = addHouseBtn.dataset.cid;
    const bKey = unit.split('_')[0];
    const cap = HOUSING_CAP[bKey] || 0;
    const currentResidents = team.filter(c => (state.housing || {})[c.id] === unit);
    const targetColonist = team.find(c => String(c.id) === String(cid));
    if (currentResidents.length < cap && targetColonist) {
      if (bKey === 'quarto' || currentResidents.length === 0 || currentResidents[0].raca === targetColonist.raca) {
        state.housing[cid] = unit;
        save(rooms); renderLobby();
      }
    }
    return;
  }
  const remHouseBtn = e.target.closest('.btn-house-remove');
  if (remHouseBtn) {
    delete state.housing[remHouseBtn.dataset.cid];
    save(rooms); renderLobby();
    return;
  }

  if (locked) return;

  // Receita da Cozinha
  const recBtn = e.target.closest('.btn-kitchen-recipe');
  if (recBtn) {
    state.kitchenRecipes[+recBtn.dataset.idx] = recBtn.dataset.rec;
    save(rooms); renderLobby();
    return;
  }

  // Tema do Laboratório
  const labBtn = e.target.closest('.btn-lab-topic');
  if (labBtn) {
    state.labResearch[+labBtn.dataset.idx] = labBtn.dataset.topic;
    save(rooms); renderLobby();
    return;
  }

  // Designar / Fixar / Remover trabalhador de Padaria, Cozinha ou Laboratório
  const setBtn = e.target.closest('.btn-bmodal-set');
  if (setBtn) {
    const key = setBtn.dataset.key, cid = setBtn.dataset.cid;
    [state.assignments, state.pinned].forEach(map => {
      Object.keys(map).forEach(o => { if (map[o] === key && o !== String(cid)) delete map[o]; });
    });
    assignColonist(state, cid, key);
    save(rooms); renderLobby();
    return;
  }
  const pinBtn = e.target.closest('.btn-bmodal-pin');
  if (pinBtn) {
    const key = pinBtn.dataset.key, cid = pinBtn.dataset.cid;
    if (state.pinned[cid] === key) delete state.pinned[cid];
    else {
      [state.assignments, state.pinned].forEach(map => {
        Object.keys(map).forEach(o => { if (map[o] === key && o !== String(cid)) delete map[o]; });
      });
      assignColonist(state, cid, key);
      state.pinned[cid] = key;
    }
    save(rooms); renderLobby();
    return;
  }
  const clearBtn = e.target.closest('.btn-bmodal-clear');
  if (clearBtn) {
    delete state.assignments[clearBtn.dataset.cid];
    save(rooms); renderLobby();
    return;
  }
};

$('farmModal').onclick = e => {
  if (e.target === $('farmModal') || e.target.closest('.btn-farm-close')) { farmOpen = false; renderLobby(); return; }
  const rooms = load(), r = rooms[currentRoom];
  if (!r || (r.seasonReady || {})[me.id]) return;
  const state = ensureColonyState(r, me.id);

  const cropBtn = e.target.closest('.btn-crop');
  if (cropBtn) {
    const i = +cropBtn.dataset.f, f = state.fields[i];
    if (!f || f.stage === 'planted') return;
    const planet = getPlayerPlanetMeta(r, me.id);
    if (!canPlantNow(planet.clima, r.seasonIdx || 0)) return;
    if (f.crop === cropBtn.dataset.crop) { f.crop = null; clearField(state, i); }
    else f.crop = cropBtn.dataset.crop;
    save(rooms); renderLobby(); return;
  }
  const setBtn = e.target.closest('.btn-field-set');
  if (setBtn) {
    assignToField(state, +setBtn.dataset.f, setBtn.dataset.cid);
    save(rooms); renderLobby(); return;
  }
  const pinBtn = e.target.closest('.btn-field-pin');
  if (pinBtn) {
    const i = +pinBtn.dataset.f, cid = pinBtn.dataset.cid, key = 'farm_' + i;
    if (state.pinned[cid] === key) delete state.pinned[cid];
    else { assignToField(state, i, cid); state.pinned[cid] = key; }
    save(rooms); renderLobby(); return;
  }
  const clearBtn = e.target.closest('.btn-field-clear');
  if (clearBtn) {
    delete state.assignments[clearBtn.dataset.cid]; // só nesta estação; se estiver fixado, volta na próxima
    save(rooms); renderLobby();
  }
};

// Menu de alimentos: selecionar Refeições (normal ou vegetariana) e alimentar colonos
$('drawerResources').onclick = e => {

};

$('catTabs').onclick = e => {

$('subOpts').onclick = e => {
  const btn = e.target.closest('.sub-opt');
  if (!btn) return;
  activeActionKey = activeActionKey === btn.dataset.act ? null : btn.dataset.act; // tocar de novo desmarca

};

$('assignBox').onclick = e => {
  const rooms = load(), r = rooms[currentRoom];
  if (!r || (r.seasonReady || {})[me.id]) return;
  const state = ensureColonyState(r, me.id);

  const assignBtn = e.target.closest('.btn-assign');
  if (assignBtn) {
    if (String(state.capsuleBuilderId) === String(assignBtn.dataset.cid) && !(state.buildings.capsula > 0)) return;
    if (!assignColonist(state, assignBtn.dataset.cid, activeActionKey)) return;
    save(rooms);
    renderLobby();
    return;
  }

  // Fixar / desafixar o colono na ação selecionada
  const pinBtn = e.target.closest('.btn-pin');
  if (pinBtn) {
    const cid = pinBtn.dataset.cid;
    if (String(state.capsuleBuilderId) === String(cid) && !(state.buildings.capsula > 0)) return;
    if (state.pinned[cid] === activeActionKey) {
      delete state.pinned[cid]; // desafixa (a tarefa desta estação continua)
    } else {
      state.pinned[cid] = activeActionKey;
      assignColonist(state, cid, activeActionKey); // já designa agora, se houver recurso
    }
    save(rooms);
    renderLobby();
    return;
  }

  const unassignBtn = e.target.closest('.btn-unassign');
  if (unassignBtn) {
    const cid = unassignBtn.dataset.cid;
    if (String(state.capsuleBuilderId) === String(cid) && !(state.buildings.capsula > 0)) return;
    const oldDef = state.assignments[cid] ? findActionDef(state.assignments[cid]) : null;
    if (oldDef) refundCost(state.resources, actionCost(oldDef));
    delete state.assignments[cid];
    save(rooms);
    renderLobby();
  }
};

$('btnNextSeason').onclick = () => {
  const rooms = load(), r = rooms[currentRoom];
  if (!r) return;
  r.seasonReady = r.seasonReady || {};

  if (r.seasonReady[me.id]) {
    delete r.seasonReady[me.id];
  } else {
    r.seasonReady[me.id] = true;
  }

  // Se todos os jogadores confirmaram, resolve as tarefas e avança a estação
  if (r.players.every(p => r.seasonReady[p.id])) {
    resolveSeasonActions(r);
    r.seasonReady = {};
    r.seasonIdx = (r.seasonIdx || 0) + 1;
    if (r.seasonIdx >= 4) {
      r.seasonIdx = 0;
      r.year = (r.year || 1) + 1;
    }
    triggerSeasonEvents(r);
  }

  save(rooms);
  renderLobby();
};

let workOpen = false;
let mapOpen = false;
let mapSel = null;

function renderWorkSheet(state, team, ready) {
  const rows = team.map(c => {
    const curKey = state.assignments[c.id];
    const pinKey = (state.pinned || {})[c.id];
    const curDef = curKey ? findActionDef(curKey) : null;
    const pinDef = pinKey ? findActionDef(pinKey) : null;

    let statusBadge = '';
    let taskText = '';
    let canClear = false;
    let canUnpin = false;

    if (curDef && pinKey === curKey) {
      statusBadge = '<span class="hunger ok">📌 Fixado</span>';
      taskText = curDef.label;
      canClear = true;
      canUnpin = true;
    } else if (curDef) {
      statusBadge = '<span class="hunger soon">⏳ Alocado momentaneamente</span>';
      taskText = curDef.label + (pinDef ? ` <small style="color:#ffd54a">(fixado em ${pinDef.label})</small>` : '');
      canClear = true;
      canUnpin = Boolean(pinDef);
    } else if (pinDef) {
      statusBadge = '<span class="hunger hungry">😴 Em repouso (fixado sem recurso)</span>';
      taskText = `Aguardando: ${pinDef.label}`;
      canUnpin = true;
    } else {
      statusBadge = '<span class="hunger" style="color:#9fb0ff; border-color:#3a4496">😴 Em repouso</span>';
      taskText = 'Nenhuma tarefa designada';
    }

    return `
      <div class="assign-row">
        <span style="display:flex; flex-direction:column; gap:3px; min-width:0">
          <span>${RACA_ICONS[c.raca]} <strong>${cName(c)}</strong> <small style="opacity:.6">· ${c.raca}</small></span>
          <span>${statusBadge}</span>
          <small style="opacity:.85">${taskText}</small>
        </span>
        <span style="display:flex; gap:5px; flex-shrink:0">
          ${canUnpin ? `<button type="button" class="sec btn-work-unpin" data-cid="${c.id}" style="padding:5px 8px; font-size:.75rem" ${ready ? 'disabled' : ''}>Desafixar</button>` : ''}
          ${canClear ? `<button type="button" class="danger btn-work-clear" data-cid="${c.id}" style="padding:5px 8px; font-size:.75rem" ${ready ? 'disabled' : ''}>Liberar</button>` : ''}
        </span>
      </div>`;
  }).join('');

  return `
    <div style="display:flex; justify-content:space-between; align-items:center">
      <strong style="color:#9fb0ff">👷 Quadro de Trabalho</strong>
      <small style="opacity:.7">${Object.keys(state.assignments || {}).length}/${team.length} ativos</small>
    </div>
    ${rows}
  `;
}

function renderColonyMapModal(r) {
  const cols = Object.fromEntries(r.players.map(p => [p.id, p.color || '#9fb0ff']));
  const colonies = r.colonies || {};
  const gridHtml = r.map.map((row, y) => row.map((t, x) => {
    const owner = colonies[y + ',' + x];
    const sel = mapSel && mapSel[0] === y && mapSel[1] === x ? ' sel' : '';
    const style = owner ? ` style="border-color:${cols[owner]};box-shadow:0 0 10px ${cols[owner]}"` : '';
    return `<div class="cell ${t}${sel}" data-y="${y}" data-x="${x}"${style}>${owner ? '🏠' : ICONS[t]}</div>`;
  }).join('')).join('');

  const chips = r.players.map(p =>
    `<span style="color:${cols[p.id]}">● ${esc(p.name)}${p.id === me.id ? ' (você)' : ''}</span>`
  ).join(' ');

  let info = '<div style="font-size:.82rem; opacity:.75; text-align:center">Toque em uma célula do mapa para inspecionar.</div>';
  if (mapSel) {
    const [y, x] = mapSel;
    const key = y + ',' + x;
    const t = r.map[y][x];
    const owner = colonies[key];
    if (t === 'estrela') {
      info = `<div class="planet-info"><strong>⭐ Estrela ${esc((r.starNames || {})[key] || 'Desconhecida')}</strong></div>`;
    } else if (t === 'planeta') {
      const meta = (r.planetMeta || {})[key] || { orbit: 'Desconhecida', clima: 'Temperado', oxigenio: '50%', recursos: 'Diversos' };
      const ownerPlayer = owner ? r.players.find(p => p.id === owner) : null;
      info = `
        <div class="planet-info">
          <div><strong>🪐 Planeta (${y + 1}, ${x + 1})</strong>${ownerPlayer ? ` · <span style="color:${cols[owner]}">🏠 Colônia de ${esc(ownerPlayer.name)}</span>` : ' · Desabitado'}</div>
          <div>🌟 <strong>Órbita:</strong> ${esc(meta.orbit)} · 🌡️ <strong>Clima:</strong> ${esc(meta.clima)}</div>
          <div>🫧 <strong>Oxigênio:</strong> ${esc(meta.oxigenio)} · ⛏️ <strong>Recursos:</strong> ${esc(meta.recursos)} · 🌙 <strong>Luas:</strong> ${meta.luas !== undefined ? meta.luas : 0}</div>
        </div>`;
    } else {
      info = `<div class="planet-info"><strong>${ICONS[t] || '▫️'} ${NAMES[t]} (${y + 1}, ${x + 1})</strong></div>`;
    }
  }

  return `
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <strong>🗺️ Mapa da Galáxia</strong>
        <button type="button" class="sec btn-map-close" style="padding:5px 12px; font-size:.8rem">Fechar ✕</button>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px 12px; font-size:.82rem; justify-content:center">${chips}</div>
      <div class="gmap-grid">${gridHtml}</div>
      ${info}
    </div>`;
}

$('workSheet').onclick = e => {
